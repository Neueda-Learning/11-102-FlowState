version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: pps-mysql
    environment:
      MYSQL_DATABASE: paymentprocessingsystem
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pps-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/paymentprocessingsystem?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
    ports:
      - "8080:8080"

volumes:
  mysql_data:

