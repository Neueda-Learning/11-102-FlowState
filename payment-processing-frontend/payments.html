<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments | Payment Processing System</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="payments">
  <div class="app-layout">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="sidebar-brand">Payment Processing System</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" data-nav="dashboard" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" data-nav="accounts" href="accounts.html">Accounts</a>
        <a class="sidebar-link" data-nav="create-payment" href="create-payment.html">Create Payment</a>
        <a class="sidebar-link" data-nav="payments" href="payments.html">Payments</a>
        <a class="sidebar-link" data-nav="failed-payments" href="failed-payments.html">Failed Payments</a>
        <a class="sidebar-link" data-nav="payments" href="payment-history.html">Payment History</a>
        <a class="sidebar-link" data-nav="audit-logs" href="audit-logs.html">Audit Logs</a>
        <a class="sidebar-link" id="logoutLink" href="login.html">Logout</a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <h1>Payments</h1>
        <div class="user-chip">USER01</div>
      </header>

      <main class="page-content">
        <div id="messageHost" class="alert hidden" role="alert" aria-live="polite"></div>

        <section class="filter-panel">
          <form id="paymentsFilterForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="filterPaymentId">Payment ID</label>
                <input id="filterPaymentId" type="text">
              </div>
              <div class="form-group">
                <label for="filterFromAccount">From Account</label>
                <select id="filterFromAccount">
                  <option value="">All</option>
                </select>
              </div>
              <div class="form-group">
                <label for="filterToAccount">To Account</label>
                <select id="filterToAccount">
                  <option value="">All</option>
                </select>
              </div>
              <div class="form-group">
                <label for="filterStatus">Status</label>
                <select id="filterStatus">
                  <option value="ALL">All</option>
                  <option value="CREATED">Created</option>
                  <option value="VALIDATED">Validated</option>
                  <option value="PROCESSING">Processing</option>
                  <option value="COMPLETED">Completed</option>
                  <option value="FAILED">Failed</option>
                  <option value="CANCELLED">Cancelled</option>
                </select>
              </div>
              <div class="form-group">
                <label for="filterFromDate">From Date</label>
                <input id="filterFromDate" type="date">
              </div>
              <div class="form-group">
                <label for="filterToDate">To Date</label>
                <input id="filterToDate" type="date">
              </div>
              <div class="form-group">
                <label for="filterMinAmount">Minimum Amount</label>
                <input id="filterMinAmount" type="number" min="0" step="0.01">
              </div>
              <div class="form-group">
                <label for="filterMaxAmount">Maximum Amount</label>
                <input id="filterMaxAmount" type="number" min="0" step="0.01">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" type="submit">Search</button>
              <button id="clearPaymentFilters" class="btn btn-secondary" type="button">Clear Filters</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Payment ID</th>
                  <th>From</th>
                  <th>To</th>
                  <th class="sortable" data-sort-by="amount">Amount</th>
                  <th class="sortable" data-sort-by="createdAt">Date</th>
                  <th class="sortable" data-sort-by="status">Status</th>
                  <th>Retry Count</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="paymentsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
