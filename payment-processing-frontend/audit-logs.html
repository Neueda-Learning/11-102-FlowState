<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs | Payment Processing System</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="audit-logs">
  <div class="app-layout">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="sidebar-brand">Payment Processing System</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" data-nav="dashboard" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" data-nav="accounts" href="accounts.html">Accounts</a>
        <a class="sidebar-link" data-nav="create-payment" href="create-payment.html">Create Payment</a>
        <a class="sidebar-link" data-nav="payments" href="payments.html">Payments</a>
        <a class="sidebar-link" data-nav="failed-payments" href="failed-payments.html">Failed Payments</a>
        <a class="sidebar-link" data-nav="payments" href="payment-history.html">Payment History</a>
        <a class="sidebar-link" data-nav="audit-logs" href="audit-logs.html">Audit Logs</a>
        <a class="sidebar-link" id="logoutLink" href="login.html">Logout</a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <h1>Audit Logs</h1>
        <div class="user-chip">USER01</div>
      </header>

      <main class="page-content">
        <div id="messageHost" class="alert hidden" role="alert" aria-live="polite"></div>

        <section class="filter-panel">
          <form id="auditFilterForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="auditUser">User</label>
                <input id="auditUser" type="text">
              </div>
              <div class="form-group">
                <label for="auditAction">Action</label>
                <input id="auditAction" type="text">
              </div>
              <div class="form-group">
                <label for="auditPaymentId">Payment ID</label>
                <input id="auditPaymentId" type="text">
              </div>
              <div class="form-group">
                <label for="auditFromDate">From Date</label>
                <input id="auditFromDate" type="date">
              </div>
              <div class="form-group">
                <label for="auditToDate">To Date</label>
                <input id="auditToDate" type="date">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" type="submit">Search</button>
              <button id="clearAuditFilters" class="btn btn-secondary" type="button">Clear Filters</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Audit ID</th>
                  <th>Timestamp</th>
                  <th>User</th>
                  <th>Action</th>
                  <th>Payment ID</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="auditLogsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
