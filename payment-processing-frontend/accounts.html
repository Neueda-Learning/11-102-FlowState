<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts | Payment Processing System</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="accounts">
  <div class="app-layout">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="sidebar-brand">Payment Processing System</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" data-nav="dashboard" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" data-nav="accounts" href="accounts.html">Accounts</a>
        <a class="sidebar-link" data-nav="create-payment" href="create-payment.html">Create Payment</a>
        <a class="sidebar-link" data-nav="payments" href="payments.html">Payments</a>
        <a class="sidebar-link" data-nav="failed-payments" href="failed-payments.html">Failed Payments</a>
        <a class="sidebar-link" data-nav="payments" href="payment-history.html">Payment History</a>
        <a class="sidebar-link" data-nav="audit-logs" href="audit-logs.html">Audit Logs</a>
        <a class="sidebar-link" id="logoutLink" href="login.html">Logout</a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <h1>Accounts</h1>
        <div class="user-chip">USER01</div>
      </header>

      <main class="page-content">
        <div id="messageHost" class="alert hidden" role="alert" aria-live="polite"></div>

        <section class="filter-panel">
          <div class="form-grid">
            <div class="form-group">
              <label for="accountSearch">Search Account</label>
              <input id="accountSearch" type="text" placeholder="Account ID or holder name">
            </div>
            <div class="form-group">
              <label for="accountStatusFilter">Status</label>
              <select id="accountStatusFilter">
                <option value="ALL">All</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-secondary" type="button">Add Account</button>
          </div>
        </section>

        <section class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Account ID</th>
                  <th>Account Holder Name</th>
                  <th>Balance</th>
                  <th>Status</th>
                  <th>Created Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="accountsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
