<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Payment Processing System</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
  <main class="login-wrapper">
	<section class="card login-card" aria-labelledby="loginTitle">
	  <h1 id="loginTitle" class="login-title">Payment Processing System</h1>
	  <p class="stat-label">Sign in to continue</p>

	  <div id="messageHost" class="alert hidden" role="alert" aria-live="polite"></div>

	  <form id="loginForm" class="form-grid" novalidate>
		<div class="form-group full-width">
		  <label for="username">Username</label>
		  <input id="username" name="username" type="text" autocomplete="username">
		  <span class="field-error" data-error-for="username"></span>
		</div>

		<div class="form-group full-width">
		  <label for="password">Password</label>
		  <input id="password" name="password" type="password" autocomplete="current-password">
		  <span class="field-error" data-error-for="password"></span>
		</div>

		<div class="form-group full-width checkbox-row">
		  <input id="rememberMe" name="rememberMe" type="checkbox">
		  <label for="rememberMe">Remember me</label>
		</div>

		<div class="form-actions full-width">
		  <button class="btn btn-primary" type="submit">Login</button>
		</div>
	  </form>
	</section>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
